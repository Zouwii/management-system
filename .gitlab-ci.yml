stages:
  - package

variables:
  GIT_STRATEGY: fetch

package-on-tag:
  stage: package
  image: ubuntu2404:20260319
  only:
    - tags
  script:
    - apt-get update
    - apt-get install -y nodejs npm
    - node -v
    - npm -v
    - chmod +x ./package-tb-tool-bt.sh
    - ./package-tb-tool-bt.sh
  artifacts:
    name: "tb_tool_bt_backend-${CI_COMMIT_TAG}"
    paths:
      - tar/*.tar.gz
    expire_in: 30 days
