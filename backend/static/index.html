<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tb_tool_b1 - DingTalk Proxy Demo</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: #f5f7fa;
        color: #303133;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 18px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .panel {
        border: 1px solid #e4e7ed;
        border-radius: 10px;
        padding: 12px;
        background: #fafafa;
      }
      .panel h2 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      input {
        flex: 1;
        min-width: 260px;
        padding: 8px 10px;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        outline: none;
      }
      select {
        padding: 8px 10px;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        min-width: 220px;
      }
      #taskIdSelect {
        width: 100%;
        min-width: 100%;
      }
      button {
        padding: 9px 14px;
        border: none;
        border-radius: 8px;
        background: #ed8a00;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #ff9b00;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 12px;
        border-radius: 10px;
        background: #f5f7fa;
        border: 1px solid #e4e7ed;
        min-height: 240px;
      }
      .muted {
        color: #606266;
        font-size: 12px;
        margin-top: 10px;
      }
      @media (max-width: 900px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>tb_tool_b1 - 超简易“前端 -> 后端 -> 钉钉(JSON)”跑通</h1>
      <div class="row">
        <button id="btnGetToken" style="background:#f56c6c">GetToken</button>
        <button id="btnHealth" style="background:#409eff">健康检查</button>
      </div>
      <div class="split">
        <div class="panel">
          <h2>左侧：项目任务查询</h2>
          <div class="row">
            <span>必填字段</span>
            <select id="projectUserSelect">
              <option value="">请选择人员</option>
            </select>
            <select id="projectIdSelect">
              <option value="">请选择项目</option>
            </select>
          </div>
          <div class="row">
            <input id="dueDateStartInput" type="datetime-local" step="1" value="2026-01-01T00:00:00" placeholder="开始时间(含时分秒)" />
            <input id="dueDateEndInput" type="datetime-local" step="1" value="2026-03-31T23:59:59" placeholder="结束时间(含时分秒)" />
          </div>
          <div class="row">
            <button id="btnProjectTaskQuery" style="background:#67c23a">查询项目任务</button>
          </div>
          <pre id="projectOut">等待查询项目任务...</pre>
        </div>
        <div class="panel">
          <h2>右侧：查任务</h2>
          <div class="row">
            <span>必填字段</span>
            <select id="taskUserSelect">
              <option value="">请选择人员</option>
            </select>
          </div>
          <div class="row">
            <span>执行者</span>
            <select id="taskExecutorSelect">
              <option value="">执行者：全部</option>
            </select>
            <label style="display:flex;align-items:center;gap:6px;">
              <input id="workhourDebugToggle" type="checkbox" />
              工时调试
            </label>
          </div>
          <div class="row">
            <input id="taskFilterInput" value="" placeholder="输入中文筛选任务（按标题或ID）" />
          </div>
          <div class="row">
            <select id="taskIdSelect">
              <option value="">请先在左侧查询项目任务</option>
            </select>
          </div>
          <div class="row">
            <input id="parentTaskIdInput" value="" placeholder="父任务ID(parentTaskId，可选，默认空)" />
          </div>
          <div class="row">
            <button id="btnUserTaskQuery" style="background:#e6a23c">查询任务</button>
          </div>
          <div class="muted" id="taskOptionHint">任务候选：0</div>
          <div class="muted" id="workhourHint">有效工时合计：0（命中任务：0）</div>
          <button id="btnAccurateWorkhour" style="background:#409eff;width:100%;margin-top:8px;">
            精确工时统计（逐个查详情）
          </button>
          <div class="muted" id="accurateWorkhourProgress">精确统计：未开始</div>
          <pre
            id="workhourDetailOut"
            style="display:none;min-height:140px;max-height:320px;overflow:auto;"
          >精确工时明细...</pre>
          <pre id="workhourDebugOut" style="display:none;min-height:80px;">工时调试信息...</pre>
          <pre id="taskOut">等待查询任务...</pre>
        </div>
      </div>
      <div class="muted">
        左侧调用 <code>POST /api/b1/project/tasks/query</code>；
        右侧调用 <code>POST /api/b1/tasks/query</code>。
      </div>
    </div>

    <script>
      const projectOutEl = document.getElementById("projectOut");
      const taskOutEl = document.getElementById("taskOut");
      const projectUserSelect = document.getElementById("projectUserSelect");
      const taskUserSelect = document.getElementById("taskUserSelect");
      const taskExecutorSelect = document.getElementById("taskExecutorSelect");
      const projectIdSelect = document.getElementById("projectIdSelect");
      const dueDateStartInput = document.getElementById("dueDateStartInput");
      const dueDateEndInput = document.getElementById("dueDateEndInput");
      const taskFilterInput = document.getElementById("taskFilterInput");
      const taskIdSelect = document.getElementById("taskIdSelect");
      const parentTaskIdInput = document.getElementById("parentTaskIdInput");
      const taskOptionHint = document.getElementById("taskOptionHint");
      const workhourHint = document.getElementById("workhourHint");
      const btnAccurateWorkhour = document.getElementById("btnAccurateWorkhour");
      const accurateWorkhourProgress = document.getElementById("accurateWorkhourProgress");
      const workhourDetailOut = document.getElementById("workhourDetailOut");
      const workhourDebugToggle = document.getElementById("workhourDebugToggle");
      const workhourDebugOut = document.getElementById("workhourDebugOut");
      let allTaskOptions = [];
      let allTaskRawRows = [];
      let currentFilteredTaskIds = [];

      function collectTaskOptionsBounded(root) {
        const out = [];
        const queue = [];
        const seen = new Set();
        const MAX_VISIT = 8000;
        const MAX_DEPTH = 8;
        const MAX_OPTIONS = 3000;
        let visited = 0;

        // 优先从常见任务容器字段抓取，减少漏提取概率
        if (root && typeof root === "object") {
          const fastBuckets = [
            root.tasks,
            root.items,
            root.list,
            root.data,
            root.records,
            root.result,
          ];
          for (let i = 0; i < fastBuckets.length; i += 1) {
            if (fastBuckets[i]) queue.push({ node: fastBuckets[i], depth: 0 });
          }
        }
        queue.push({ node: root, depth: 0 });

        while (queue.length > 0 && visited < MAX_VISIT && out.length < MAX_OPTIONS) {
          const cur = queue.shift();
          const node = cur.node;
          const depth = cur.depth;
          if (!node || typeof node !== "object") continue;
          if (seen.has(node)) continue;
          seen.add(node);
          visited += 1;

          if (Array.isArray(node)) {
            for (let i = 0; i < node.length && out.length < MAX_OPTIONS; i += 1) {
              queue.push({ node: node[i], depth: depth + 1 });
            }
            continue;
          }

          const id = node.taskId || node.id || node.task_id;
          const name =
            node.content ||
            node.subject ||
            node.title ||
            node.text ||
            node.name ||
            node.taskName ||
            node.task_name;
          if (id) {
            out.push({
              id: String(id),
              name: name ? String(name) : String(id),
              executorId: node.executorId ? String(node.executorId) : "",
            });
          }

          if (depth >= MAX_DEPTH) continue;
          const keys = Object.keys(node);
          for (let i = 0; i < keys.length; i += 1) {
            const k = keys[i];
            if (k === "raw" || k === "html" || k === "description") continue;
            queue.push({ node: node[k], depth: depth + 1 });
          }
        }
        return out;
      }

      function prettyJsonWithLimit(obj, maxLen = 20000) {
        const s = JSON.stringify(obj, null, 2);
        if (s.length <= maxLen) return s;
        return `${s.slice(0, maxLen)}\n...（结果过大，已截断显示，总长度 ${s.length}）`;
      }

      function fillTaskIdOptionsFromProjectResult(resp) {
        const dingtalk = ((((resp || {}).data || {}).data || {}).dingtalk) || {};
        let out = [];
        if (Array.isArray(dingtalk.result)) {
          allTaskRawRows = dingtalk.result;
          // 优先按钉钉标准返回直接提取，避免深遍历漏数据
          out = dingtalk.result
            .map((x) => ({
              id: x && x.taskId ? String(x.taskId) : "",
              name: x && x.content ? String(x.content) : "",
              executorId: x && x.executorId ? String(x.executorId) : "",
            }))
            .filter((x) => x.id);
        } else {
          allTaskRawRows = [];
          const source = dingtalk || resp || {};
          out = collectTaskOptionsBounded(source);
        }
        const dedup = {};
        out.forEach((x) => {
          if (!dedup[x.id]) dedup[x.id] = x;
        });
        const items = Object.keys(dedup).map((k) => dedup[k]);
        allTaskOptions = items;
        renderTaskSelectOptions("");
        updateWorkhourSummary();
      }

      function getTargetWorkhourField(row) {
        const TARGET_ID = "64c8cad8485fb3987a5521b8";
        const fields = row.customFields || row.customfields || [];
        if (!Array.isArray(fields)) return null;
        for (let i = 0; i < fields.length; i += 1) {
          const f = fields[i] || {};
          const fid = f.customFieldId || f.customfieldId;
          if (String(fid || "") === TARGET_ID) return f;
        }
        return null;
      }

      function parseWorkhourFromTaskRow(row) {
        const f = getTargetWorkhourField(row || {});
        if (!f) return 0;

        let vals = f.value;
        if (vals === undefined || vals === null) return 0;
        // 某些返回把 value 序列化成字符串 JSON
        if (typeof vals === "string") {
          try {
            vals = JSON.parse(vals);
          } catch (e) {
            vals = [];
          }
        }
        const parseFrom = (x) => {
          if (x === undefined || x === null) return 0;
          if (typeof x === "number") return Number.isFinite(x) ? x : 0;
          if (typeof x === "string") {
            const m = x.match(/-?\d+(\.\d+)?/);
            if (m) {
              const n = Number(m[0]);
              return Number.isFinite(n) ? n : 0;
            }
            const n = Number(x);
            return Number.isFinite(n) ? n : 0;
          }
          const n2 = Number(x);
          return Number.isFinite(n2) ? n2 : 0;
        };

        if (Array.isArray(vals)) {
          if (vals.length === 0) return 0;
          const v0 = vals[0] || {};
          return parseFrom(v0.title !== undefined ? v0.title : v0.value !== undefined ? v0.value : v0.numberValue);
        }

        // value 有可能是对象而不是数组
        if (typeof vals === "object") {
          const maybeTitle = vals.title !== undefined ? vals.title : vals.value;
          return parseFrom(maybeTitle);
        }

        return 0;
      }

      function updateWorkhourSummary() {
        const executorId = (taskExecutorSelect.value || "").trim();
        const rows = executorId
          ? allTaskRawRows.filter((r) => String((r && r.executorId) || "") === executorId)
          : allTaskRawRows;
        let total = 0;
        let hit = 0;
        let hasFieldCount = 0;
        let valuePresentCount = 0;
        const debugRows = [];
        for (let i = 0; i < rows.length; i += 1) {
          const row = rows[i] || {};
          const v = parseWorkhourFromTaskRow(row);
          if (v > 0) hit += 1;
          total += v;
          if (i < 20) {
            const targetField = getTargetWorkhourField(row);
            const hasTarget = !!targetField;
            const targetVal = targetField ? targetField.value : undefined;
            const valuePresent = !(targetVal === undefined || targetVal === null);
            if (typeof targetRaw === "string") {
              try {
                targetRaw = JSON.parse(targetRaw);
              } catch (e) {
                // 保留原始字符串，便于排查
              }
            }
            if (hasTarget) hasFieldCount += 1;
            if (hasTarget && valuePresent) valuePresentCount += 1;
            debugRows.push({
              taskId: row.taskId || "",
              content: row.content || "",
              executorId: row.executorId || "",
              hasTargetField: hasTarget,
              parsedWorkhour: v,
              hasValue: valuePresent,
              targetValue: targetVal,
            });
          } else {
            const fields = row.customFields || row.customfields || [];
            const hasTarget = Array.isArray(fields)
              ? fields.some((f) => {
                  const fid = f && (f.customFieldId || f.customfieldId);
                  return String(fid || "") === "64c8cad8485fb3987a5521b8";
                })
              : false;
            if (hasTarget) hasFieldCount += 1;
          }
        }
        workhourHint.textContent = `有效工时合计：${total}（筛选任务：${rows.length}，含字段任务：${hasFieldCount}，含值任务：${valuePresentCount}，非零命中：${hit}）`;
        if (workhourDebugToggle.checked) {
          workhourDebugOut.style.display = "block";
          workhourDebugOut.textContent = JSON.stringify(
            {
              targetFieldId: "64c8cad8485fb3987a5521b8",
              filteredCount: rows.length,
              hitCount: hit,
              totalWorkhour: total,
              valuePresentCount,
              sample: debugRows,
            },
            null,
            2
          );
        } else {
          workhourDebugOut.style.display = "none";
        }
      }

      function renderTaskSelectOptions(keyword) {
        const kw = (keyword || "").trim();
        const executorId = (taskExecutorSelect.value || "").trim();
        let items = allTaskOptions;
        if (executorId) {
          items = items.filter((x) => (x.executorId || "") === executorId);
        }
        if (kw) {
          items = items.filter((x) => x.name.indexOf(kw) >= 0 || x.id.indexOf(kw) >= 0);
        }
        currentFilteredTaskIds = items.map((x) => x.id);
        taskIdSelect.innerHTML = "";
        if (items.length === 0) {
          const op = document.createElement("option");
          op.value = "";
          op.textContent = kw ? "无匹配项" : "左侧结果中未识别到任务ID（可重查或放宽时间范围）";
          taskIdSelect.appendChild(op);
          taskOptionHint.textContent = `任务候选：0`;
          return;
        }
        items.forEach((item) => {
          const op = document.createElement("option");
          op.value = item.id;
          op.textContent = `${item.name}（${item.id}）`;
          taskIdSelect.appendChild(op);
        });
        taskIdSelect.value = items[0].id;
        taskOptionHint.textContent = `任务候选：${items.length}`;
      }

      function resolveTaskIdFromInput() {
        return (taskIdSelect.value || "").trim();
      }

      function toIsoFromDatetimeLocal(v) {
        return new Date(v).toISOString();
      }

      function forceStartDayTime() {
        const v = (dueDateStartInput.value || "").trim();
        if (!v) return;
        const d = v.slice(0, 10);
        if (!d) return;
        dueDateStartInput.value = `${d}T00:00:00`;
      }

      function forceEndDayTime() {
        const v = (dueDateEndInput.value || "").trim();
        if (!v) return;
        const d = v.slice(0, 10);
        if (!d) return;
        dueDateEndInput.value = `${d}T23:59:59`;
      }

      function buildProjectQuery() {
        const start = (dueDateStartInput.value || "").trim();
        const end = (dueDateEndInput.value || "").trim();
        const clauses = [];
        if (start) clauses.push(`dueDate >= '${toIsoFromDatetimeLocal(start)}'`);
        if (end) clauses.push(`dueDate <= '${toIsoFromDatetimeLocal(end)}'`);
        if (clauses.length === 0) {
          return "";
        }
        return clauses.map((c) => `(${c})`).join(" AND ");
      }

      function filterSoftwareOnly(resp) {
        const DEV_ID = "647854bcd999c893061ef8b5";
        const cloned = JSON.parse(JSON.stringify(resp || {}));
        const dingtalk = ((((cloned || {}).data || {}).data || {}).dingtalk) || {};
        if (!Array.isArray(dingtalk.result)) return cloned;
        dingtalk.result = dingtalk.result.filter((x) => {
          const sid = (x && (x.scenarioFieldConfigId || x.scenariofieldconfigId)) || "";
          return sid === DEV_ID;
        });
        return cloned;
      }

      async function postTaskQuery(payload) {
        const res = await fetch("/api/b1/project/tasks/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {}),
        });
        return res.json();
      }

      async function postUserTaskQuery(payload) {
        const res = await fetch("/api/b1/tasks/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {}),
        });
        return res.json();
      }

      async function loadUserOptions() {
        const res = await fetch("/api/b1/config/userids");
        const data = await res.json();
        const users = (((data || {}).data || {}).users) || [];
        const DEFAULT_USER_NAME = "邹宏睿";
        users.forEach((u) => {
          const op1 = document.createElement("option");
          op1.value = u.userId;
          op1.textContent = `${u.name} (${u.userId})`;
          projectUserSelect.appendChild(op1);
          const op2 = document.createElement("option");
          op2.value = u.userId;
          op2.textContent = `${u.name} (${u.userId})`;
          taskUserSelect.appendChild(op2);
          const op3 = document.createElement("option");
          op3.value = u.userId;
          op3.textContent = `${u.name} (${u.userId})`;
          taskExecutorSelect.appendChild(op3);
        });
        // 默认选中：邹宏睿（对应的必填字段）
        const zhr = users.find((x) => String(x && x.name) === DEFAULT_USER_NAME);
        if (zhr && zhr.userId) {
          projectUserSelect.value = zhr.userId;
          taskUserSelect.value = zhr.userId;
          // 执行者筛选框目前也沿用默认值，保证体验一致
          taskExecutorSelect.value = zhr.userId;
          return;
        }
        // fallback：选第一个
        if (users.length > 0) {
          projectUserSelect.value = users[0].userId;
          taskUserSelect.value = users[0].userId;
          taskExecutorSelect.value = users[0].userId;
        }
      }

      async function loadProjectOptions() {
        const res = await fetch("/api/b1/config/projectids");
        const data = await res.json();
        const projects = (((data || {}).data || {}).projects) || [];
        projects.forEach((p) => {
          const op = document.createElement("option");
          op.value = p.projectId;
          op.textContent = `${p.name}（${p.projectId}）`;
          projectIdSelect.appendChild(op);
        });
        if (projects.length > 0) {
          projectIdSelect.value = projects[0].projectId;
        }
      }

      document.getElementById("btnProjectTaskQuery").addEventListener("click", async () => {
        projectOutEl.textContent = "查询项目任务中...";
        const payload = {
          userId: projectUserSelect.value,
          projectId: projectIdSelect.value,
          query: buildProjectQuery(),
          maxResults: 500,
        };
        if (!payload.userId || !payload.projectId) {
          projectOutEl.textContent = "请先选择人员和项目。";
          return;
        }
        const data = await postTaskQuery(payload);
        const softwareOnlyData = filterSoftwareOnly(data);
        projectOutEl.textContent = prettyJsonWithLimit(softwareOnlyData);
        // 避免大结果时阻塞主线程，延迟一帧再构建右侧下拉
        setTimeout(() => {
          fillTaskIdOptionsFromProjectResult(softwareOnlyData);
        }, 0);
      });

      document.getElementById("btnUserTaskQuery").addEventListener("click", async () => {
        taskOutEl.textContent = "查询任务中...";
        const payload = {
          userId: taskUserSelect.value,
          taskId: resolveTaskIdFromInput(),
          parentTaskId: parentTaskIdInput.value,
        };
        if (!payload.userId || !payload.taskId) {
          taskOutEl.textContent = "请先在左侧查询项目任务后，选择任务。";
          return;
        }
        const data = await postUserTaskQuery(payload);
        taskOutEl.textContent = prettyJsonWithLimit(data);
      });

      async function accurateWorkhourByTaskIdsSequential(taskIds, userId) {
        const TARGET_FIELD_ID = "64c8cad8485fb3987a5521b8";
        let total = 0;
        let hit = 0;
        const nameMap = {};
        for (let i = 0; i < allTaskOptions.length; i += 1) {
          const it = allTaskOptions[i];
          if (it && it.id) nameMap[it.id] = it.name || "";
        }

        const DETAIL_LIMIT = 200;
        const detailRows = [];
        for (let i = 0; i < taskIds.length; i += 1) {
          const taskId = taskIds[i];
          accurateWorkhourProgress.textContent = `精确统计：${i + 1}/${taskIds.length}（taskId=${taskId}）`;
          const payload = {
            userId: userId,
            taskId: taskId,
            parentTaskId: parentTaskIdInput.value || "",
          };
          const resp = await postUserTaskQuery(payload);
          const dingtalk = ((((resp || {}).data || {}).data || {}).dingtalk) || {};
          let row = null;
          if (Array.isArray(dingtalk.result)) row = dingtalk.result[0] || null;
          else if (dingtalk.result) row = dingtalk.result;
          else row = null;
          const v = parseWorkhourFromTaskRow(row || {});
          if (v > 0) hit += 1;
          total += v;

          if (detailRows.length < DETAIL_LIMIT) {
            detailRows.push({
              taskId: String(taskId),
              taskName: nameMap[String(taskId)] || "",
              workhour: v,
            });
          }
          await new Promise((r) => setTimeout(r, 0));
        }
        return {
          total,
          hit,
          count: taskIds.length,
          targetFieldId: TARGET_FIELD_ID,
          detailRows,
          detailLimit: DETAIL_LIMIT,
        };
      }

      btnAccurateWorkhour.addEventListener("click", async () => {
        try {
          const userId = (taskUserSelect.value || "").trim();
          if (!userId) {
            accurateWorkhourProgress.textContent = "精确统计失败：请先选择右侧必填字段（userId）。";
            return;
          }
          if (!currentFilteredTaskIds || currentFilteredTaskIds.length === 0) {
            accurateWorkhourProgress.textContent = "精确统计失败：当前没有可统计的任务候选。";
            return;
          }
          btnAccurateWorkhour.disabled = true;
          btnAccurateWorkhour.textContent = "精确统计中...";
          accurateWorkhourProgress.textContent = `精确统计：共 ${currentFilteredTaskIds.length} 条，逐个查询中...`;

          const summary = await accurateWorkhourByTaskIdsSequential(currentFilteredTaskIds, userId);
          workhourHint.textContent = `有效工时合计：${summary.total}（命中任务：${summary.hit}，精确查询任务：${summary.count}）`;
          accurateWorkhourProgress.textContent = `精确统计完成：有效工时=${summary.total}，命中任务=${summary.hit}（共${summary.count}条）`;

          if (summary && Array.isArray(summary.detailRows)) {
            const lines = summary.detailRows.map((d) => {
              const n = d.taskName ? d.taskName : d.taskId;
              return `${n}（${d.taskId}）：${d.workhour}`;
            });
            const more = summary.count > summary.detailLimit ? `\n...（仅展示前${summary.detailLimit}条）` : "";
            workhourDetailOut.textContent = lines.join("\n") + more;
            workhourDetailOut.style.display = "block";
          }
        } catch (e) {
          accurateWorkhourProgress.textContent =
            "精确统计异常：" + (e && e.message ? e.message : String(e));
        } finally {
          btnAccurateWorkhour.disabled = false;
          btnAccurateWorkhour.textContent = "精确工时统计（逐个查详情）";
        }
      });

      taskFilterInput.addEventListener("input", () => {
        renderTaskSelectOptions(taskFilterInput.value);
      });
      taskExecutorSelect.addEventListener("change", () => {
        renderTaskSelectOptions(taskFilterInput.value);
        updateWorkhourSummary();
      });
      workhourDebugToggle.addEventListener("change", () => {
        updateWorkhourSummary();
      });

      dueDateStartInput.addEventListener("change", forceStartDayTime);
      dueDateEndInput.addEventListener("change", forceEndDayTime);


      document.getElementById("btnHealth").addEventListener("click", async () => {
        projectOutEl.textContent = "健康检查中...";
        taskOutEl.textContent = "健康检查中...";
        const res = await fetch("/api/b1/health");
        const data = await res.json();
        projectOutEl.textContent = prettyJsonWithLimit(data);
        taskOutEl.textContent = prettyJsonWithLimit(data);
      });

      document.getElementById("btnGetToken").addEventListener("click", async () => {
        projectOutEl.textContent = "获取 token 中...";
        taskOutEl.textContent = "获取 token 中...";
        const res = await fetch("/api/b1/gettoken", { method: "POST" });
        const data = await res.json();
        projectOutEl.textContent = prettyJsonWithLimit(data);
        taskOutEl.textContent = prettyJsonWithLimit(data);
      });

      // 页面加载自动初始化
      Promise.all([loadUserOptions(), loadProjectOptions()]).catch((e) => {
        const msg = "加载配置失败：" + (e && e.message ? e.message : String(e));
        projectOutEl.textContent = msg;
        taskOutEl.textContent = msg;
      });
    </script>
  </body>
</html>
