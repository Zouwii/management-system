services:
  mysql:
    image: mysql:8.0
    container_name: tb_tool_bt_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tb_tool_bt_local_dev}
      MYSQL_DATABASE: tb_tool_bt
      MYSQL_USER: tb_tool_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-tb_tool_bt_local_dev}
    ports:
      - "3306:3306"
    volumes:
      - tb_tool_bt_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  tb_tool_bt:
    build: .
    container_name: tb_tool_bt
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      - DINGTALK_APPKEY=${DINGTALK_APPKEY}
      - DINGTALK_APPSECRET=${DINGTALK_APPSECRET}
      - TB_TOOL_BT_DEBUG=${TB_TOOL_BT_DEBUG:-false}
      - TB_TOOL_BT_USE_MYSQL=1
      - TB_TOOL_BT_DB_HOST=mysql
      - TB_TOOL_BT_DB_PORT=3306
      - TB_TOOL_BT_DB_USER=tb_tool_app
      - TB_TOOL_BT_DB_PASSWORD=${MYSQL_APP_PASSWORD:-tb_tool_bt_local_dev}
      - TB_TOOL_BT_DB_NAME=tb_tool_bt
    restart: unless-stopped

volumes:
  tb_tool_bt_mysql_data:

